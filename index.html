<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project | Tic Tac Toe</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Tic Tac Toe</h1>
        </header>
        <main>
            <div class="content">
                <div id="boardGrid"></div>
                <div id="status"></div>
                <div class="playerOne">
                    <div id="playerOneName">Player 1</div>
                    <div id="playerOneScore">0</div>
                </div>
                <div class="playerTwo">
                    <div id="playerTwoName">Player 2</div>
                    <div id="playerTwoScore">0</div>
                </div>
            </div>
            <div class="buttons">
                <button type="button" id="newGame">New Game</button>
                <button type="button" id="rematch">Rematch</button>
            </div>
            <dialog class="setupDialog">
                <form class="setupForm">
                    <div class="playerOneField">
                        <label for="p1-name">Player 1</label>
                        <input type="text" name="p1-name" id="p1-name" maxlength="12" placeholder="Player 1">
                    </div>
                    <div class="playerTwoField">
                        <label for="p2-name">Player 2</label>
                        <input type="text" name="p2-name" id="p2-name" maxlength="12" placeholder="Player 2">
                    </div>
                </form>
                <button type="submit" id="startBtn" form="setupForm">Start Game</button>
            </dialog>
        </main>
        <footer>
            <div class="footerLink">
                &copy;
                <a id="odiLink" href="https://www.theodinproject.com/about" target="_blank">The Odin Project</a>. All rights reserved. 
                <a id="githubLink" href="https://github.com/yehoshua-001/tic-tac-toe/" target="_blank">github.com/yehoshua-001</a>
            </div>
        </footer>
    </body>
</html>
